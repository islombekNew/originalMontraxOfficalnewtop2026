<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede2c8"/>
      <stop offset="1" stop-color="#d8c9a8"/>
    </linearGradient>
    <linearGradient id="paperInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4e8"/>
      <stop offset="1" stop-color="#f2ebde"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#c9b898" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#dots)"/>

  <!-- Deep chocolate wash — o'ng chekka -->
  <path d="M900 0 L1600 0 L1600 700 L820 700 Z" fill="#1a1512" opacity="0.94"/>

  <!-- Dashboard mock — dark surface ustida bronze accent -->
  <g transform="translate(920,110)">
    <rect width="600" height="480" rx="16" fill="#f2ebde" stroke="#c9b898" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="480" rx="16" fill="#ebe2d0"/>
    <rect x="24" y="30" width="100" height="10" rx="5" fill="#a06d3a"/>
    <rect x="24" y="70" width="80" height="7" rx="3.5" fill="#c9b898"/>
    <rect x="24" y="94" width="90" height="7" rx="3.5" fill="#c9b898"/>
    <rect x="24" y="118" width="70" height="7" rx="3.5" fill="#c9b898"/>
    <rect x="24" y="142" width="85" height="7" rx="3.5" fill="#6b7a4f"/>

    <!-- Header -->
    <rect x="178" y="30" width="220" height="16" rx="8" fill="#1a1512"/>
    <rect x="178" y="56" width="120" height="8" rx="4" fill="#7a6f64"/>

    <!-- KPI cards -->
    <rect x="178" y="90" width="130" height="90" rx="12" fill="#faf4e8" stroke="#d5c8b0"/>
    <rect x="322" y="90" width="130" height="90" rx="12" fill="#faf4e8" stroke="#d5c8b0"/>
    <rect x="466" y="90" width="112" height="90" rx="12" fill="#a06d3a"/>
    <rect x="192" y="106" width="60" height="8" rx="4" fill="#7a6f64"/>
    <rect x="192" y="126" width="80" height="16" rx="8" fill="#1a1512"/>
    <rect x="192" y="152" width="50" height="6" rx="3" fill="#6b7a4f"/>
    <rect x="336" y="106" width="60" height="8" rx="4" fill="#7a6f64"/>
    <rect x="336" y="126" width="70" height="16" rx="8" fill="#1a1512"/>
    <rect x="336" y="152" width="45" height="6" rx="3" fill="#a06d3a"/>
    <rect x="480" y="106" width="60" height="8" rx="4" fill="#faf4e8" opacity="0.6"/>
    <rect x="480" y="126" width="80" height="16" rx="8" fill="#faf4e8"/>
    <rect x="480" y="152" width="50" height="6" rx="3" fill="#faf4e8" opacity="0.7"/>

    <!-- Chart -->
    <rect x="178" y="200" width="400" height="170" rx="12" fill="#faf4e8" stroke="#d5c8b0"/>
    <polyline points="200,340 250,320 300,325 350,275 400,285 450,235 500,215 550,225"
      fill="none" stroke="#a06d3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="200,340 250,320 300,325 350,275 400,285 450,235 500,215 550,225 550,360 200,360 Z"
      fill="#a06d3a" opacity="0.12"/>
    <circle cx="550" cy="225" r="5" fill="#a06d3a"/>
    <circle cx="550" cy="225" r="9" fill="none" stroke="#a06d3a" opacity="0.3"/>

    <!-- Rows -->
    <rect x="178" y="390" width="400" height="14" rx="7" fill="#ebe2d0"/>
    <rect x="178" y="416" width="400" height="14" rx="7" fill="#ebe2d0"/>
    <rect x="178" y="442" width="280" height="14" rx="7" fill="#ebe2d0"/>
  </g>

  <!-- Title on cream side -->
  <g font-family="'Times New Roman', serif">
    <text x="80" y="220" fill="#7a6f64" font-size="16" letter-spacing="6" font-family="Arial, sans-serif">SAVDO TIZIMI — 2026</text>
    <text x="80" y="340" fill="#1a1512" font-size="96" font-weight="700" letter-spacing="-3" font-family="Arial, sans-serif">MONTRAX</text>
    <text x="80" y="440" fill="#a06d3a" font-size="96" font-weight="400" font-style="italic">savdo</text>
  </g>
  <rect x="80" y="470" width="60" height="3" fill="#a06d3a"/>
  <text x="80" y="520" fill="#4a3f37" font-size="14" font-family="Arial, sans-serif">Bir dashboard — inventar, savdo, qarz.</text>
</svg>
